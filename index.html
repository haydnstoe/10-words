<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Study Guide & Quiz</title>

<style>

*,
*::before,
*::after{
    box-sizing:border-box;
}

:root{
    --primary:#2a5d9f;
    --primary-dark:#1d4374;
    --background:#f4f6f8;
    --card:#ffffff;
    --text:#222;
    --success:#d4edda;
    --error:#f8d7da;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--background);
    color:var(--text);
    line-height:1.6;
}

.container{
    max-width:1000px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.reference-grid{
    display:grid;
    gap:15px;
}

.word-entry{
    border-left:5px solid var(--primary);
}

button{
    width:100%;
    border:none;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    cursor:pointer;
    background:var(--primary);
    color:white;
    font-size:1rem;
}

button:hover{
    background:var(--primary-dark);
}

.answer-button{
    background:white;
    color:black;
    border:1px solid #ccc;
}

.answer-button:hover{
    background:#eef5ff;
}

.correct{
    background:var(--success) !important;
}

.incorrect{
    background:var(--error) !important;
}

.feedback{
    margin-top:15px;
    padding:15px;
    border-radius:8px;
    background:#f1f1f1;
}

.progress{
    font-weight:bold;
    margin-bottom:10px;
}

.progress-bar{
    width:100%;
    height:12px;
    background:#dedede;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-fill{
    height:100%;
    background:var(--primary);
    transition:width .3s ease;
}

.score-box{
    text-align:center;
}

.award{
    font-size:1.4rem;
    font-weight:bold;
    margin-top:15px;
}

.review-item{
    border-left:5px solid var(--primary);
}

@media(min-width:768px){

    .reference-grid{
        grid-template-columns:1fr 1fr;
    }

    button{
        width:auto;
        min-width:220px;
    }
}

</style>
</head>

<body>

<div class="container">

<header>

<h1>Vocabulary Study Guide & Quiz</h1>

<p>
Learn the vocabulary first, then test yourself.
</p>

</header>

<section class="card">

<h2>Select Mode</h2>

<label>
<input type="radio"
       name="mode"
       value="practice"
       checked>
Practice Mode
</label>

<br>

<label>
<input type="radio"
       name="mode"
       value="test">
Test Mode
</label>

<br><br>

<button id="startQuiz">
Start Quiz
</button>

</section>

<section>

<h2>Vocabulary Reference</h2>

<div id="referenceList"
     class="reference-grid">
</div>

</section>

<div id="quiz"></div>

<div id="results"></div>

</div>

<script>

const vocabulary = [

{
word:"Decedent",
definition:"A person who has died, especially in a legal context.",
example:"The lawyer reviewed the decedent's will.",
synonym:"Deceased person",
antonym:"Living person"
},

{
word:"Obligatory",
definition:"Required by rule, law, or custom.",
example:"Wearing a seatbelt is obligatory.",
synonym:"Required",
antonym:"Optional"
},

{
word:"Bovine",
definition:"Related to cattle.",
example:"The farmer owned several bovine animals.",
synonym:"Cow-like",
antonym:"Feline"
},

{
word:"Carnivore",
definition:"An animal that eats meat.",
example:"A lion is a carnivore.",
synonym:"Meat-eater",
antonym:"Herbivore"
},

{
word:"Herbivore",
definition:"An animal that eats plants.",
example:"A rabbit is a herbivore.",
synonym:"Plant-eater",
antonym:"Carnivore"
},

{
word:"Omnivore",
definition:"An animal that eats both plants and animals.",
example:"A bear is an omnivore.",
synonym:"Mixed feeder",
antonym:"Specialist eater"
},

{
word:"Despondent",
definition:"Feeling hopeless or discouraged.",
example:"The team felt despondent after losing.",
synonym:"Disheartened",
antonym:"Hopeful"
},

{
word:"Satirise",
definition:"To criticise using humour or irony.",
example:"The cartoonist used humour to satirise politics.",
synonym:"Mock",
antonym:"Praise"
},

{
word:"Obligate",
definition:"To bind by duty or responsibility.",
example:"The contract obligates both parties.",
synonym:"Bind",
antonym:"Free"
},

{
word:"Correspondent",
definition:"A reporter or regular communicator.",
example:"The foreign correspondent reported from abroad.",
synonym:"Reporter",
antonym:"Audience member"
},

{
word:"Penalise",
definition:"To impose a punishment.",
example:"The referee may penalise a player.",
synonym:"Punish",
antonym:"Reward"
},

{
word:"Vivacious",
definition:"Lively and energetic.",
example:"Her vivacious personality brightened the room.",
synonym:"Animated",
antonym:"Dull"
}

];

function shuffle(array){
    return [...array].sort(() => Math.random() - 0.5);
}

const referenceList =
document.getElementById("referenceList");

referenceList.innerHTML =
vocabulary.map(v => `
<div class="card word-entry">
<h3>${v.word}</h3>
<p>${v.definition}</p>
<p><em>${v.example}</em></p>
</div>
`).join("");

let quizMode="practice";
let score=0;
let answered=0;
let currentQuestionIndex=0;
let studentAnswers=[];
let questions=[];

const quizDiv =
document.getElementById("quiz");

const resultsDiv =
document.getElementById("results");

function generateQuestion(item){

const types=[
"definition",
"example",
"synonym",
"antonym"
];

const type=
types[Math.floor(
Math.random()*types.length
)];

let questionText="";
let answer="";
let pool=[];

switch(type){

case "definition":

questionText=
`What is the definition of "${item.word}"?`;

answer=item.definition;
pool=vocabulary.map(v=>v.definition);

break;

case "example":

questionText=
`Which word best fits this example sentence?

"${item.example}"`;

answer=item.word;
pool=vocabulary.map(v=>v.word);

break;

case "synonym":

questionText=
`Which is the best synonym for "${item.word}"?`;

answer=item.synonym;
pool=vocabulary.map(v=>v.synonym);

break;

case "antonym":

questionText=
`Which is the best antonym for "${item.word}"?`;

answer=item.antonym;
pool=vocabulary.map(v=>v.antonym);

break;
}

const options=[answer];

while(options.length<4){

const choice=
pool[Math.floor(
Math.random()*pool.length
)];

if(
choice &&
!options.includes(choice)
){
options.push(choice);
}
}

return{
word:item.word,
definition:item.definition,
questionText,
answer,
options:shuffle(options)
};
}

document
.getElementById("startQuiz")
.addEventListener(
"click",
startQuiz
);

function startQuiz(){

quizMode=
document.querySelector(
'input[name="mode"]:checked'
).value;

score=0;
answered=0;
currentQuestionIndex=0;
studentAnswers=[];

resultsDiv.innerHTML="";
quizDiv.innerHTML="";

questions=
shuffle(
vocabulary.map(
generateQuestion
)
);

renderQuestion();
}

function renderQuestion(){

quizDiv.innerHTML="";

const q=
questions[currentQuestionIndex];

const percent=
((currentQuestionIndex+1)
/
questions.length)
*100;

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="progress">

Question
${currentQuestionIndex+1}
of
${questions.length}

</div>

<div class="progress-bar">

<div class="progress-fill"
style="width:${percent}%">

</div>

</div>

<h2>
${q.questionText}
</h2>

`;

q.options.forEach(option=>{

const btn=
document.createElement("button");

btn.className=
"answer-button";

btn.textContent=
option;

btn.addEventListener(
"click",
()=>processAnswer(
card,
btn,
option,
q
)
);

card.appendChild(btn);

});

quizDiv.appendChild(card);
}

function processAnswer(
card,
button,
selected,
question
){

const buttons=
card.querySelectorAll("button");

buttons.forEach(
b=>b.disabled=true
);

const correct=
selected===question.answer;

if(correct){

button.classList.add(
"correct"
);

score++;

}else{

button.classList.add(
"incorrect"
);

buttons.forEach(b=>{

if(
b.textContent===
question.answer
){
b.classList.add(
"correct"
);
}

});

}

studentAnswers.push({

word:question.word,
selected,
correctAnswer:
question.answer,

correct,

definition:
question.definition

});

answered++;

if(
quizMode==="practice"
){

const feedback=
document.createElement("div");

feedback.className=
"feedback";

feedback.innerHTML=
correct
?
`
<strong>✓ Correct</strong>

<p>
${question.word}
means:
${question.definition}
</p>
`
:
`
<strong>✗ Incorrect</strong>

<p>
Correct answer:
${question.answer}
</p>

<p>
${question.word}
means:
${question.definition}
</p>
`;

card.appendChild(
feedback
);

}

setTimeout(()=>{

if(
currentQuestionIndex
<
questions.length-1
){

currentQuestionIndex++;

renderQuestion();

}else{

showResults();

}

},
quizMode==="practice"
?2500
:500
);

}

function showResults(){

const percent=
Math.round(
(score/questions.length)
*100
);

let award="Pass";

if(percent>=90){

award="🏆 Gold";

}else if(percent>=75){

award="🥈 Silver";

}else if(percent>=60){

award="🥉 Bronze";

}

let html=`

<div class="card score-box">

<h2>
Quiz Complete
</h2>

<p>
Score:
${score}
/
${questions.length}
</p>

<p>
${percent}%
</p>

<div class="award">
${award}
</div>

</div>
`;

if(
quizMode==="test"
){

html+=`
<div class="card">

<h2>
Review
</h2>
`;

studentAnswers.forEach(
(r,index)=>{

html+=`

<div class=
"card review-item">

<h3>
Question
${index+1}
</h3>

<p>
<strong>Word:</strong>
${r.word}
</p>

<p>
<strong>Your answer:</strong>
${r.selected}
</p>

<p>
<strong>Correct answer:</strong>
${r.correctAnswer}
</p>

<p>
${r.correct
? "✓ Correct"
: "✗ Incorrect"}
</p>

<p>
${r.definition}
</p>

</div>

`;

});

html+=`</div>`;
}

html+=`

<div class="card">

<button
onclick="startQuiz()">

Restart Quiz

</button>

</div>

`;

resultsDiv.innerHTML=
html;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

</script>

</body>
</html>
