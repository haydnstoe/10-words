<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Quiz</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:auto;padding:20px;background:#f4f6f8}.card{background:#fff;padding:15px;margin:12px 0;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1)}button{display:block;width:100%;margin:6px 0;padding:10px} .correct{background:#d4edda}.incorrect{background:#f8d7da}</style></head><body><h1>Vocabulary Study Guide & Quiz</h1><div class="card"><h2>Select Mode</h2><label><input type="radio" name="mode" value="practice" checked> Practice</label><br><label><input type="radio" name="mode" value="test"> Test</label><br><button onclick="startQuiz()">Start Quiz</button></div><div id="guide"></div><div id="quiz"></div><div id="results"></div><script>const vocabulary=[{word:'Decedent',definition:'A person who has died, especially in a legal context.',example:'The lawyer reviewed the decedent's will.',synonym:'Deceased person',antonym:'Living person'},{word:'Obligatory',definition:'Required by rule, law, or custom.',example:'Wearing a seatbelt is obligatory.',synonym:'Required',antonym:'Optional'},{word:'Bovine',definition:'Related to cattle.',example:'The farmer owned several bovine animals.',synonym:'Cow-like',antonym:'Feline'},{word:'Carnivore',definition:'An animal that eats meat.',example:'A lion is a carnivore.',synonym:'Meat-eater',antonym:'Herbivore'},{word:'Herbivore',definition:'An animal that eats plants.',example:'A rabbit is a herbivore.',synonym:'Plant-eater',antonym:'Carnivore'},{word:'Omnivore',definition:'An animal that eats plants and animals.',example:'A bear is an omnivore.',synonym:'Mixed feeder',antonym:'Specialist eater'},{word:'Despondent',definition:'Feeling hopeless or discouraged.',example:'She felt despondent after the loss.',synonym:'Disheartened',antonym:'Hopeful'},{word:'Satirise',definition:'To criticise using humour or irony.',example:'The comedian used jokes to satirise politics.',synonym:'Mock',antonym:'Praise'},{word:'Obligate',definition:'To bind by duty or responsibility.',example:'The contract obligates both parties.',synonym:'Bind',antonym:'Free'},{word:'Correspondent',definition:'A reporter or regular communicator.',example:'The foreign correspondent reported from abroad.',synonym:'Reporter',antonym:'Audience member'},{word:'Penalise',definition:'To impose a punishment.',example:'The referee may penalise a player.',synonym:'Punish',antonym:'Reward'},{word:'Vivacious',definition:'Lively and energetic.',example:'Her vivacious personality brightened the room.',synonym:'Animated',antonym:'Dull'}]; function shuffle(a){return [...a].sort(()=>Math.random()-.5)}; const guide=document.getElementById('guide'); guide.innerHTML='<h2>Vocabulary Reference</h2>'+vocabulary.map(v=>`<div class=card><b>${v.word}</b><br>${v.definition}<br><i>${v.example}</i></div>`).join(''); let score=0,answered=0,mode='practice',student=[]; function genQ(v){const t=['definition','example','synonym','antonym'][Math.floor(Math.random()*4)]; let q='',ans='',pool=[]; if(t==='definition'){q=`What is the definition of "${v.word}"?`;ans=v.definition;pool=vocabulary.map(x=>x.definition)} if(t==='example'){q=`Which word best fits: "${v.example}"`;ans=v.word;pool=vocabulary.map(x=>x.word)} if(t==='synonym'){q=`Choose the best synonym for "${v.word}"`;ans=v.synonym;pool=vocabulary.map(x=>x.synonym)} if(t==='antonym'){q=`Choose the best antonym for "${v.word}"`;ans=v.antonym;pool=vocabulary.map(x=>x.antonym)} let opts=[ans]; while(opts.length<4){let r=pool[Math.floor(Math.random()*pool.length)]; if(!opts.includes(r))opts.push(r)} return {word:v.word,definition:v.definition,q,ans,opts:shuffle(opts)}} function startQuiz(){mode=document.querySelector('input[name=mode]:checked').value; document.getElementById('quiz').innerHTML=''; document.getElementById('results').innerHTML=''; score=0;answered=0;student=[]; const qs=shuffle(vocabulary.map(genQ)); qs.forEach((x,i)=>{let d=document.createElement('div');d.className='card'; d.innerHTML=`<h3>${i+1}. ${x.q}</h3>`; x.opts.forEach(o=>{let b=document.createElement('button'); b.textContent=o; b.onclick=()=>{if(d.dataset.done)return; d.dataset.done=1; [...d.querySelectorAll('button')].forEach(btn=>btn.disabled=true); const ok=o===x.ans; if(ok){score++;b.classList.add('correct')} else {b.classList.add('incorrect'); [...d.querySelectorAll('button')].find(btn=>btn.textContent===x.ans)?.classList.add('correct')} student.push({word:x.word,selected:o,correct:x.ans,ok,definition:x.definition}); answered++; if(mode==='practice'){d.innerHTML+=`<div><strong>${ok?'Correct':'Incorrect'}</strong><br>${x.word}: ${x.definition}</div>`} if(answered===qs.length)showResults();}; d.appendChild(b)}); document.getElementById('quiz').appendChild(d)})} function showResults(){let pct=Math.round(score/vocabulary.length*100); let h=`<div class='card'><h2>Score: ${score}/${vocabulary.length} (${pct}%)</h2>`; if(mode==='test'){h+='<h3>Review</h3>'; student.forEach((s,i)=>{h+=`<div class=card>${i+1}. <b>${s.word}</b><br>Your answer: ${s.selected}<br>Correct answer: ${s.correct}<br>${s.ok?'✅ Correct':'❌ Incorrect'}<br>${s.definition}</div>`})} h+='<button onclick="startQuiz()">Restart Quiz</button></div>'; document.getElementById('results').innerHTML=h;} </script></body></html>
