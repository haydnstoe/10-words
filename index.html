<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vocabulary Study Guide & Quiz</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<div class="container">

    <header>

        <h1>
            Vocabulary Study Guide & Quiz
        </h1>

        <p>
            Read the vocabulary guide below and then
            test your knowledge.
        </p>

    </header>

    <section class="card">

        <h2>
            Select Mode
        </h2>

        <label>
            <input type="radio"
                   name="mode"
                   value="practice"
                   checked>
            Practice Mode
        </label>

        <label>
            <input type="radio"
                   name="mode"
                   value="test">
            Test Mode
        </label>

        <button id="startQuiz">
            Start Quiz
        </button>

    </section>

    <section>

        <h2>
            Vocabulary Reference
        </h2>

        <div id="referenceList"
             class="reference-grid">
        </div>

    </section>

    <section id="quiz">
    </section>

    <section id="results">
    </section>

</div>

<script src="js/quiz.js"></script>

</body>
</html>
